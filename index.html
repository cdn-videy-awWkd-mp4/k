   <div class="container">
        <h1></h1>
        <video id="myVideo" controls autoplay muted playsinline>
            <source src="https://cdn.videy.co/HtRJF3YP1.mp4" type="video/mp4">
            <!-- Anda bisa menambahkan format lain jika diperlukan, contoh: -->
            <!-- <source src="https://qu.ax/dHZSi.mp4" type="video/webm"> -->
            Maaf, browser Anda tidak mendukung pemutaran video.
        </video>
        <p id="countdownMessage"><span id="countdown">5</span> detik...</p>
    </div>



    <script>
        const videoElement = document.getElementById('myVideo');
        const countdownElement = document.getElementById('countdown');
        // Ganti dengan URL iklan Adstera Anda yang sebenarnya
        const adsteraAdUrl ="https://www.effectivecpmnetwork.com/ke86zu6ub6?key=c08d52614a7e00d3ba83ccee1ba90057"; // Contoh: 'https://ad.adstera.com/redirect?id=YOUR_AD_ID'

        let timeLeft = 5;
        let countdownInterval;

        // Fungsi untuk memulai hitung mundur dan pengalihan
        function startRedirection() {
            countdownInterval = setInterval(() => {
                timeLeft--;
                countdownElement.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(countdownInterval);
                    console.log('Mengalihkan ke:', adsteraAdUrl);
                    window.location.href = adsteraAdUrl; // Lakukan pengalihan
                }
            }, 1000); // Setiap 1 detik
        }

        // Pastikan video siap diputar sebelum memulai hitung mundur
        // Event 'canplaythrough' memastikan video sudah cukup di-buffer untuk diputar tanpa henti
        videoElement.addEventListener('canplaythrough', () => {
            console.log('Video siap diputar. Memulai hitung mundur.');
            videoElement.play().catch(error => {
                // Tangani kasus di mana autoplay diblokir (misalnya, jika 'muted' dihapus)
                console.warn('Autoplay diblokir atau gagal:', error);
                document.getElementById('countdownMessage').textContent = 'Video tidak dapat diputar otomatis. Harap putar secara manual untuk melanjutkan.';
                // Jika autoplay gagal, Anda mungkin ingin memulai hitung mundur setelah pengguna mengklik play
                videoElement.addEventListener('play', startRedirection, { once: true });
            });
            startRedirection(); // Mulai hitung mundur segera setelah video siap
        }, { once: true }); // Hanya jalankan listener ini sekali

        // Dalam kasus error loading video
        videoElement.addEventListener('error', () => {
            console.error('Terjadi kesalahan saat memuat video.');
            document.getElementById('countdownMessage').textContent = 'Terjadi kesalahan saat memuat video. Pengalihan mungkin tidak terjadi.';
            clearInterval(countdownInterval); // Hentikan hitung mundur jika ada masalah video
        });

        // Fallback jika 'canplaythrough' tidak terpicu atau video diputar dengan cara lain
        // Jika video sudah mulai diputar (misalnya karena user interaksi), pastikan countdown berjalan
        videoElement.addEventListener('play', () => {
            if (!countdownInterval) { // Hanya mulai jika belum dimulai
                console.log('Video mulai diputar (melalui interaksi atau fallback). Memulai hitung mundur.');
                startRedirection();
            }
        }, { once: true }); // Hanya jalankan listener ini sekali
    </script>
